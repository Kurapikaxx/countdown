<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Wedding Countdown 💍</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  }

  /* floating glow circles */
  .bg span {
    position: absolute;
    display: block;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    animation: float 20s linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0); }
    100% { transform: translateY(-10vh) scale(1); }
  }

  .container {
    z-index: 2;
    max-width: 800px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    margin-bottom: 20px;
  }

  .timer {
    font-size: 40px;
    margin: 20px 0;
    letter-spacing: 2px;
  }

  .message {
    margin-top: 25px;
    font-size: 20px;
    opacity: 0.9;
    min-height: 60px;
  }

  .signature {
    margin-top: 30px;
    font-size: 16px;
    opacity: 0.7;
  }

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
  <h1>Counting down to forever 💍</h1>
  <div class="timer" id="timer"></div>
  <div class="message" id="message"></div>
  <div class="signature">— from BASHAR with love ❤️</div>
</div>

<script>
/* ---------------- COUNTDOWN ---------------- */
const weddingDate = new Date("2026-08-30T18:00:00").getTime();

setInterval(() => {
  const now = new Date().getTime();
  const diff = weddingDate - now;

  if (diff <= 0) {
    document.getElementById("timer").innerHTML = "Today is the day ❤️";
    return;
  }

  const d = Math.floor(diff / (1000 * 60 * 60 * 24));
  const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const m = Math.floor((diff / (1000 * 60)) % 60);
  const s = Math.floor((diff / 1000) % 60);

  document.getElementById("timer").innerHTML =
    `${d} days ${h} hours ${m} minutes ${s} seconds`;
}, 1000);


/* ---------------- DAILY MESSAGE ---------------- */

/* Pre-written AI-style romantic messages */
const messages = [
  "Every second that passes brings me closer to holding your hand forever.",
  "You are not just my love, you are my calm, my home, my everything.",
  "If I had to choose again, I would still choose you in every lifetime.",
  "The best part of my future is that it includes you in it.",
  "Loving you is the easiest and most beautiful thing I’ve ever done.",
  "You turned ordinary days into something magical.",
  "No matter how far the day feels, you are always my peace.",
  "You are the reason I believe in forever.",
  "Every moment with you feels like a memory worth keeping.",
  "My favorite place in the world is right next to you."
];

/* Change message every 24 hours automatically */
const today = Math.floor(Date.now() / (1000 * 60 * 60 * 24));
const messageIndex = today % messages.length;

document.getElementById("message").innerText = messages[messageIndex];


/* ---------------- FLOATING BACKGROUND ---------------- */
const bg = document.querySelector(".bg");

for (let i = 0; i < 20; i++) {
  const span = document.createElement("span");

  span.style.width = span.style.height = Math.random() * 100 + "px";
  span.style.left = Math.random() * 100 + "%";
  span.style.animationDuration = (10 + Math.random() * 20) + "s";
  span.style.opacity = Math.random();

  bg.appendChild(span);
}
</script>

</body>
</html>
