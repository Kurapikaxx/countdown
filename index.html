<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Wedding Countdown 💍</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  }

  /* floating glow circles */
  .bg span {
    position: absolute;
    display: block;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    animation: float 20s linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0); }
    100% { transform: translateY(-10vh) scale(1); }
  }

  .container {
    z-index: 2;
    max-width: 800px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    margin-bottom: 20px;
  }

  .timer {
    font-size: 40px;
    margin: 20px 0;
    letter-spacing: 2px;
  }

  .message {
    margin-top: 25px;
    font-size: 20px;
    opacity: 0.9;
    min-height: 60px;
  }

  .signature {
    margin-top: 30px;
    font-size: 16px;
    opacity: 0.7;
  }

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">
  <h1>Counting down to forever 💍</h1>
  <div class="timer" id="timer"></div>
  <div class="message" id="message"></div>
  <div class="signature">— from BASHAR with love ❤️</div>
</div>

<script>
/* ---------------- COUNTDOWN ---------------- */
const weddingDate = new Date("2026-08-30T18:00:00").getTime();

setInterval(() => {
  const now = new Date().getTime();
  const diff = weddingDate - now;

  if (diff <= 0) {
    document.getElementById("timer").innerHTML = "Today is the day ❤️";
    return;
  }

  const d = Math.floor(diff / (1000 * 60 * 60 * 24));
  const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const m = Math.floor((diff / (1000 * 60)) % 60);
  const s = Math.floor((diff / 1000) % 60);

  document.getElementById("timer").innerHTML =
    `${d} days ${h} hours ${m} minutes ${s} seconds`;
}, 1000);


/* ---------------- DAILY MESSAGE ---------------- */

const messages = [
  "Every day that passes feels like one step closer to forever with you.",
  "Counting down the moments until I can call you mine forever.",
  "You are the dream I never want to wake up from.",
  "Soon, I won’t have to imagine forever — I’ll be living it with you.",
  "Loving you feels like home I never knew I was missing.",
  "With every heartbeat, I fall for you all over again.",
  "The closer we get, the more certain I am that it’s always been you.",
  "You are my today, my tomorrow, and everything after.",
  "Forever doesn’t feel long enough when it’s with you.",
  "I can’t wait to begin the rest of my life by your side.",
  "Every second apart is just a second closer to being together forever.",
  "You are the answer to every quiet wish I’ve ever made.",
  "My heart chose you long before I even knew what love was.",
  "Life makes more sense with you in it.",
  "You are my once-in-a-lifetime kind of love.",
  "The best chapters of my life are the ones I’ll write with you.",
  "I didn’t just find love in you — I found everything.",
  "Being yours is my favorite place to be.",
  "The wait is worth it, because it ends with you.",
  "You make forever feel like something to look forward to.",
  "Every moment brings me closer to saying “always” with you.",
  "You are my calm in every storm and my joy in every day.",
  "My heart has been counting down to you all along.",
  "I see my whole future every time I look at you.",
  "You turned love into something I finally understand.",
  "I would find you in every lifetime, without hesitation.",
  "Soon, “you and me” becomes “us forever.”",
  "You are the reason my heart feels so full.",
  "Loving you feels like the beginning of everything beautiful.",
  "I can’t wait to spend forever discovering life with you."
];

/* Change message every 24 hours automatically */
const today = Math.floor(Date.now() / (1000 * 60 * 60 * 24));
const messageIndex = today % messages.length;

document.getElementById("message").innerText = messages[messageIndex];


/* ---------------- FLOATING BACKGROUND ---------------- */
const bg = document.querySelector(".bg");

for (let i = 0; i < 20; i++) {
  const span = document.createElement("span");

  span.style.width = span.style.height = Math.random() * 100 + "px";
  span.style.left = Math.random() * 100 + "%";
  span.style.animationDuration = (10 + Math.random() * 20) + "s";
  span.style.opacity = Math.random();

  bg.appendChild(span);
}
</script>

</body>
</html>
